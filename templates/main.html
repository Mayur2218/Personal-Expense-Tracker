<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&" />
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/styles.css') }}">
</head>
<body>
<input type="checkbox" id="nav-toggle" hidden>
    <header class="d-flex align-items-center justify-content-between py-3 mb-4 border-bottom" style="color: white;">
        <div class="logo col-auto" style="margin-left: 30px;">
            <a href="/header" class="link-body-emphasis text-decoration-none">𝐄𝐱𝐩𝐞𝐧𝐬𝐞 𝐓𝐫𝐚𝐜𝐤𝐞𝐫</a>
        </div>
        <label for="nav-toggle" class="menu-icon d-lg-none" style="margin-right: 30px;">
            <span class="material-symbols-outlined">menu</span>
        </label>
        <ul class="nav mx-auto">
            <li class="nav-item"><a class="nav-link active" href="/header">
                <span class="material-symbols-outlined">home</span>Dashboard</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="/add-expense">
                <span class="material-symbols-outlined">add_box</span>Add Expense</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="/history">
                <span class="material-symbols-outlined">work_history</span>History</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="/monthly">
                <span class="material-symbols-outlined">dataset</span>Reports</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="/account">
                <span class="material-symbols-outlined">account_balance_wallet</span>Account</a>
            </li>
        </ul>
        <div class="button col-auto d-none d-lg-block">
            {% if not logged_in: %}
                <button class="btn btn-outline-dark">
                    <a class="nav-link" href="/">
                        <span class="material-symbols-outlined">login</span>Login
                    </a>
                </button>
            {% endif %}
            <button class="btn btn-outline-light" style="margin-right: 30px;">
                <a class="nav-link" href="/logout">
                    <span class="material-symbols-outlined" style="margin-top:3px;">logout</span>Logout
                </a>
            </button>
        </div>
    </header>
    {% block body %}
    {% endblock body %}
</body>
</html>
