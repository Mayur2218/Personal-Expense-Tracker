<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .container{
            max-width: 70rem;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5 bg-dark-subtle">
        <h2>Update Expense</h2>

        <form action="/update/{{data.id}}" method="POST">
            <div class="mb-3">
                <label for="title" class="form-label">Expense Title</label>
                <input type="text" class="form-control" id="title" value="{{data.expense}}" name="title" required>
            </div>
            <div class="mb-3">
                <label for="amount" class="form-label">Amount (₹)</label>
                <input type="number" class="form-control" id="amount" value="{{data.amount}}" name="amount" required>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-control" id="category" name="category">
                    <option value="{{data.category}}">Food</option>
                    <option value="{{data.category}}">Transport</option>
                    <option value="{{data.category}}">Shopping</option>
                    <option value="{{data.category}}">Entertainment</option>
                    <option value="{{data.category}}">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" value="{{data.date}}" id="date" name="date" required>
            </div>
            <button type="submit" class="btn btn-success mb-4">Update Expense</button>
        </form>
    </div>

</body>
</html>
