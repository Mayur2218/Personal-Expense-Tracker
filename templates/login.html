<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-container {
            max-width: 450px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .login-container .cardbody{
            margin-left: 50px;
            margin-right: 50px;
            margin-top: 45px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="login-container">
            <h3 class="text-center">Login to Expense Tracker</h3>
            <form method="POST">
                {{ form.hidden_tag() }}
                <div class="cardbody">
                    <label for="email" class="form-label">{{ form.email.label }}</label>
                    {{ form.email(class="form-control", id="email", placeholder="Enter your email") }}
                </div>
                <div class="cardbody">
                    <label for="password" class="form-label">{{ form.password.label }}</label>
                    {{ form.password(class="form-control", id="password", placeholder="Enter your password") }}
                </div>
                <button type="submit" class="btn btn-primary d-grid col-4 mx-auto w-10">{{form.submit.label}}</button>
            </form>
            <p class="text-center mt-3">
                Don't have an account? <a href="/signup">Signup</a>
            </p>
        </div>
    </div>

</body>

</html>
