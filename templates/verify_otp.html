<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-label {
            font-weight: 500;
            color: #212529;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px;
            transition: all 0.3s ease-in-out;
        }
        .form-control:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 8px rgba(106, 17, 203, 0.5);
        }
        .btn-primary {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }
        .btn-primary:hover {
            background: linear-gradient(to right, #2575fc, #6a11cb);
        }
        .text-center a {
            color: #6a11cb;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease-in-out;
        }
        .text-center a:hover {
            text-decoration: underline;
            color: #2575fc;
        }
    </style>
</head>
<body style="background: aliceblue;">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row border rounded-5 p-3 bg-white shadow box-area" style="width:1220px;">
            <div class="col-md-6 rounded-4 d-flex justify-content-center align-items-center flex-column left-box" style="background: #1633C6">
                <div class="featured-image mb-3">
                    <img src="{{ url_for('static', filename='assets/reset.png')}}" class="img-fluid" style="width:450px;">
                </div>
                <p class="text-white fs-3" style="font-family:'Courier New',Courier,monospace; font-weight:600;">Verified OTP!</p>
            </div>
            <div class="col-md-6 right-box">
                <div class="row align-items-center" style="margin-left:5px;">
                    <div class="header-text mt-4 mb-3">
                        <h5>Hello,User</h5>
                    </div>
                    <form method="POST">
                        {% with messages = get_flashed_messages() %}
                          {% if messages %}
                            <ul class="flashes">
                            {% for message in messages %}
                              {{ message }}
                            {% endfor %}
                            </ul>
                          {% endif %}
                        {% endwith %}
                        {{ form.hidden_tag() }}
                        <div class="card-body">
                            <label class="form-label mt-5">{{ form.otp.label }}</label>
                            {{ form.otp(class="form-control", id="otp", placeholder="Enter OTP") }}
                        </div>
                        <button type="submit" class="btn btn-primary d-grid col-4 mt-4 mx-auto w-100">{{ form.submit.label }}</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
